<style>
/* Two hats on one trip. The organizer sees a board: every slot of the trip, the options for it, and what is left to decide or book. Mom and dad see only the picks, as a treasure map of Rome. Deliberately single-theme: old paper. */
:root{
  --paper:#F1E4C8; --paper-2:#E7D5B0; --card:#FBF5E8; --ink:#3B2A1E; --ink-2:#6B5543; --line:#D9C6A0;
  --trail:#9B2F22; --seal:#8E1F1A; --gold:#C8902E; --pine:#3F6B45; --warn:#B4532A;
  --f-hand:"Amatic SC","Suez One",cursive; --f-display:"Suez One","Assistant",serif; --f-body:"Assistant","Arial Hebrew",Arial,sans-serif; --f-roman:"Cinzel","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--trail);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate}
#app{position:fixed;inset:0;overflow:hidden}

/* ---------- map (mom & dad) ---------- */
#stage{position:absolute;inset:0;background:var(--paper)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(110,70,20,.28) 100%)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;direction:ltr}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply}
.top{position:absolute;top:0;inset-inline:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:5px;flex:1;min-width:0;padding:2px}
@media (min-width:700px){.chips{justify-content:center}.chap{flex:0 1 150px!important}}
.chap{flex:1 1 0;min-width:0;height:38px;padding:0 2px;border-radius:12px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 2px 6px rgba(80,50,15,.12)}
.chap b{font-family:var(--f-roman);font-size:14px}
.chap small{font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;max-width:100%}
.chap[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chap[aria-pressed="true"] small{color:var(--paper-2)}
.chap.today{border-color:var(--trail)}
.ib{flex:none;width:36px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);display:grid;place-items:center;box-shadow:0 2px 6px rgba(80,50,15,.12)}
.ib svg{width:20px;height:20px}
.banner{margin:6px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:8px;padding:3px 12px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);box-shadow:0 2px 6px rgba(80,50,15,.12);pointer-events:none!important;font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap}
.banner .k{font-family:var(--f-roman);font-size:12px;color:var(--trail)}
.banner h1{margin:0;font:inherit;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;max-width:56vw}
.banner .seg{display:inline-flex;background:var(--paper);border-radius:999px;padding:2px;pointer-events:auto;margin-inline-start:2px}.banner .seg button{pointer-events:auto;border:0;background:none;font:inherit;font-size:12.5px;font-weight:800;color:var(--ink-2);padding:4px 10px;border-radius:999px;min-height:30px}.banner .seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.banner .clock{font-size:12px;color:var(--ink-2);font-weight:700}

/* sheet */
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(60,35,10,.25);display:flex;flex-direction:column;max-height:82%;transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .body{touch-action:pan-y}
.sheet .grab{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none}
.sheet .grab i{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet .body{overflow-y:auto;overscroll-behavior:contain;padding:0 16px 18px}
.sheet.peek .body{overflow:hidden}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.peekrow{touch-action:none;display:flex;align-items:center;gap:12px;min-height:64px;width:100%;border:0;background:none;padding:0 0 10px;text-align:start}
.ph0{width:64px;height:64px;border-radius:14px;flex:none;background:var(--paper-2);display:grid;place-items:center;font-family:var(--f-roman);font-weight:700;color:var(--gold);overflow:hidden}
.ph0 img{width:100%;height:100%;object-fit:cover}
.ph0 svg{width:26px;height:26px;color:var(--ink-2)}
.peekrow .tx{min-width:0;flex:1}
.peekrow .l{font-size:12px;font-weight:800;color:var(--trail);letter-spacing:.03em}
.sheet:not(.peek) .peekrow .t{white-space:normal}
.peekrow .t{font-family:var(--f-display);font-size:19px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.peekrow .up{flex:none;width:36px;height:36px;border-radius:50%;background:var(--paper);border:0!important;padding:0!important;min-height:0!important;box-shadow:0 1px 3px rgba(60,35,10,.18);display:grid;place-items:center;font-size:16px;color:var(--ink-2)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
/* the "now" ticket: what to do next, and the two things you can do about it, without opening anything */
.go{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;padding:0 0 12px}
.go .btn{min-height:48px;font-size:17px}.sheet.peek .body>.card{margin-top:env(safe-area-inset-bottom,0px)} /* the closed ticket ends above the home bar */
.go .wide{grid-column:1/-1}
/* Ugi's line about where they are heading lives in the ticket, never over the map */
.ugiline{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#F6EBD3;border-radius:12px;padding:6px 10px 6px 8px;margin:0 0 10px;text-align:start;font-size:14px;line-height:1.35;color:var(--ink)}
.ugiline img{flex:none;width:30px;height:auto}
.ugiline span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peekrow .l b{color:var(--ink);font-weight:800}
.arrived{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 12px;padding:10px 12px;border-radius:14px;background:#E2EDDC;color:var(--pine);font-weight:800;font-size:17px}
@media (prefers-reduced-motion:no-preference){.arrived.fresh{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}@keyframes stamp{0%{transform:scale(1.6) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
 .note.fresh{animation:unfold .7s .25s ease-out both}@keyframes unfold{0%{transform:perspective(600px) rotateX(-70deg);transform-origin:top;opacity:0}100%{transform:none;opacity:1}}}
.note.locked{text-align:center;background:repeating-linear-gradient(-45deg,#FFFDF7 0 12px,#FBF3E2 12px 24px)}
.note.locked .seal2{width:54px;height:54px;margin:2px auto 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C5463A,var(--seal) 70%);color:#F6D9A8;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 8px rgba(80,10,5,.35)}
.note.locked p{margin:0;color:var(--ink-2);font-size:15px}
.cl{margin-top:16px;background:#FFFDF7;border:1px solid var(--line);border-radius:16px;padding:12px 12px 6px}
.cl h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;display:flex;align-items:center;gap:8px}
.cl h3 span{font-family:var(--f-body);font-size:13px;font-weight:800;color:var(--pine);background:#E2EDDC;border-radius:999px;padding:1px 9px}
.cl>p{margin:2px 0 8px;font-size:13px;color:var(--ink-2)}
.cl.tr{background:#FFF6E6;border-color:#EBD3A8}
.cr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.cr .ci{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:19px;display:grid;place-items:center;padding:0}
.cr .ct{flex:1;min-width:0;border:0;background:none;text-align:start;padding:0}
.cr .ct b{display:block;font-size:15px;line-height:1.25}
.cr .ct small{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.cr .cn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--pine)}
.cr .cn svg{width:18px;height:18px}
.cr .ck{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--line);font-size:17px}
.cr .ck[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.cr.done .ct b{color:var(--pine)}.cr.done .ci{background:#E2EDDC;border-color:#BFD6B5;color:var(--pine);font-weight:800}
.btn.back{width:100%;margin-top:10px;background:var(--paper);color:var(--ink)}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 0 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.car.strip figure{flex:0 0 auto;width:96px;scroll-snap-align:start;padding:0}
.car.strip img{width:96px;height:68px;aspect-ratio:auto;object-fit:cover;border-radius:10px;display:block}
.pmore{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-2px 0 10px;font-size:13.5px;color:var(--ink-2);font-weight:700}.pmore a{color:var(--trail);text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
.booked.warnb{background:#FFF1DC;color:#7A4A12}
.nav button,.aarr{direction:ltr;unicode-bidi:isolate}
.conc{background:#EEF3EA;border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5;margin:10px 0}
.noamsg{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 4px;border:1.5px solid #EBD3A8;background:#FFF6E6;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;color:var(--ink);text-align:start}
.noamsg img{width:44px;height:44px;border-radius:50%;object-fit:cover}.noamsg .nm{flex:1;min-width:0}.noamsg .nm b{display:block;font-size:15.5px}.noamsg .nm small{display:block;font-weight:600;font-size:12.5px;color:var(--ink-2)}.noamsg .nopen{flex:none;background:var(--trail);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:0 3px 8px rgba(155,47,34,.3)}.noamsg{box-shadow:0 3px 10px rgba(120,70,20,.12);cursor:pointer}
.car.strip{margin-top:4px}.car.strip figcaption{display:none}
.ib.menu{flex-direction:column;gap:3.5px;display:flex;align-items:center;justify-content:center}.ib.menu i{display:block;width:16px;height:2px;border-radius:2px;background:var(--ink)}
.drawer{position:absolute;inset:0;z-index:45}
.dscrim{position:absolute;inset:0;background:rgba(30,18,8,.4);opacity:0;transition:opacity .25s}
.dpanel{position:absolute;top:0;bottom:0;right:0;width:min(320px,84vw);background:var(--card);box-shadow:-10px 0 30px rgba(40,20,5,.3);padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 18px;display:flex;flex-direction:column;gap:6px;transform:translateX(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.drawer.open .dscrim{opacity:1}.drawer.open .dpanel{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dhead img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--paper)}
.dhead b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}.dhead small{color:var(--ink-2);font-weight:700;font-size:12.5px}
.dhead>div{flex:1;min-width:0}.dx{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);font-size:20px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;border-radius:14px;background:none;padding:6px 10px;text-align:start}
.ditem .di{flex:none;width:38px;height:38px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font-size:19px}
.ditem b{display:block;font-size:16px}.ditem small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:700}
.ditem.on{background:var(--paper-2)}
.dhint{margin:auto 4px 0;font-size:12px;color:var(--ink-2)}
.bhead .ib.menu{order:9;margin-inline-start:auto}
.card.plan .ph{margin:16px 0 4px;font-family:var(--f-display);font-weight:400;font-size:19px}.card.plan .ph b{color:var(--trail);font-family:var(--f-roman);margin-inline-end:6px}
.tday{font-family:var(--f-body);font-size:12px;font-weight:800;color:#fff;background:var(--trail);border-radius:999px;padding:1px 8px;vertical-align:middle}
.prow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;text-align:start}
.pbar{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}.pbar .btn{min-height:44px;padding:0 16px}
.prow.ed{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 10px;align-items:center;padding:10px 0}.prow.ed .pctl{grid-column:1/-1;margin:0}.prow.ed .px b{font-size:16px}.prow.ed small.bk{color:var(--trail);font-weight:800}
.prow.off{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px 10px;align-items:center}.prow.ed .pt{width:96px;min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-weight:800;font-size:15px;padding:0 6px}
.pctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}.pctl button,.pctl select{min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-size:13.5px;font-weight:700;padding:0 10px;color:var(--ink)}.pctl button:disabled{opacity:.35}
.prow.off{opacity:.65}.prow.off .btn{min-height:40px;padding:0 14px;flex:none}
.padd{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px;border-top:1px dashed var(--line)}.padd input{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:15px;background:var(--card)}.padd input:first-child{flex:1 1 180px}.padd .btn{min-height:44px;padding:0 16px}
.prow .pt{flex:none;width:44px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.prow .ph0{width:46px;height:46px;border-radius:10px}
.prow .px{flex:1;min-width:0}.prow .px b{display:block;font-size:15px;line-height:1.25}.prow .px small{display:block;font-size:12.5px;color:var(--ink-2)}
.prow .pk{flex:none;font-size:12px;font-weight:800;color:var(--pine)}.prow.now .pk{color:#fff;background:var(--trail);border-radius:999px;padding:2px 8px}.prow.done .px b{color:var(--pine)}
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#app input,#app textarea,#app .letter,#app .desk{-webkit-user-select:text;user-select:text}

.peekv{position:absolute;inset:0;z-index:50}

.pcard{position:absolute;left:50%;top:50%;width:min(370px,calc(100% - 28px));max-height:min(78vh,640px);translate:-50% -50%;display:flex;flex-direction:column;background:var(--card);border-radius:22px;box-shadow:0 24px 60px rgba(30,15,5,.42);overflow:hidden;scale:.86;opacity:0;transition:scale .22s cubic-bezier(.2,1.3,.4,1),opacity .18s,transform .15s}
.peekv.open .pscrim{opacity:1}.peekv.open .pcard{scale:1;opacity:1}
.pgrab{flex:none;height:18px;display:grid;place-items:center}.pgrab i{width:38px;height:4px;border-radius:2px;background:var(--line)}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 6px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.phead>div{flex:1;min-width:0}.phead .ph0{width:52px;height:52px}

.pline{margin:6px 0 0;font-size:15.5px}.pugi{display:flex;gap:8px;align-items:flex-start;margin-top:10px;background:#F6EBD3;border-radius:14px;padding:8px 10px}

/* shared: photo slides */

/* slot sheet (organizer) */
.modal{position:absolute;inset:0;z-index:15;background:rgba(30,18,8,.45);display:flex;align-items:flex-end;justify-content:center}

.draft{white-space:pre-wrap;direction:ltr;text-align:left;background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

.ed{display:grid;gap:8px}
.ed label,.details label{display:grid;gap:2px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ed .row,.details .row{display:flex;flex-wrap:wrap;gap:8px}
.ed .row>*,.details .row>*{flex:1 1 140px}

/* postcards: illustrated front + Noa's words, read aloud with karaoke */
.car figure.pc{padding:10px;background:#FFFDF7}
.car figure.pc img{border-radius:4px;aspect-ratio:4/5}
.car figure.pc::after{content:"ROMA · XVI·X";position:absolute;top:16px;left:16px;font-family:var(--f-roman);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--trail);background:#FFFDF7;border:2px dashed var(--trail);padding:6px 8px;transform:rotate(-6deg)}

.optfx{display:grid;gap:8px;margin-top:12px}

/* Ugi, the guide: a cut-out character standing on the ticket's top edge. His pose follows the moment (data-pose, see UGI):
   peek = his head over the edge while quiet · talk = head up, the mouth moves with the typing · point = the whole dog, pointing into the map.
   The button's box ends exactly at the ticket's edge and clips him, so "peek" reads as a dog behind the paper. */

async function play(id,btn,seek){
  if(audio&&audio._id===id&&seek==null){if(audio.paused){audio.play()}else{audio.pause()}return}
  stopAudio();

  const words=v&&v.words?v.words:(wordCache[id]||(wordCache[id]=await fetch("postcards/"+id+".words.json").then(r=>r.json()).catch(()=>[])));
  audio=new Audio(v&&v.src?src(v.src):"postcards/"+id+".mp3");audio._id=id;
  const note=btn.closest(".note"),spans=[...note.querySelectorAll("[data-w]")];
  note.classList.add("playing");
  const paint=()=>{const t=audio.currentTime;let cur=-1;for(let i=0;i<words.length;i++){if(words[i][1]<=t)cur=i;else break}
    spans.forEach((sp,i)=>{sp.classList.toggle("on",i===cur&&t<=words[i][2]+.25);sp.classList.toggle("past",i<cur)})};
  audio.addEventListener("timeupdate",paint);
  audio.addEventListener("play",()=>{btn.innerHTML=PAUSE;(function tick(){if(audio&&!audio.paused){paint();requestAnimationFrame(tick)}})()});
  audio.addEventListener("pause",()=>{btn.innerHTML=PLAY});
  audio.addEventListener("ended",()=>{btn.innerHTML=PLAY;note.classList.remove("playing");spans.forEach(sp=>sp.classList.remove("on","past"))});
  if(seek!=null&&words[seek])audio.currentTime=words[seek][1];

}
